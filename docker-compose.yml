services:
  postgres:
    image: postgres:17.12
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starbucks}
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase-db:
    image: postgres:17.12
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase:v0.65.6.2
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_HOST: metabase-db
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3000}
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_OPTS: -Xmx1024m
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      metabase-db:
        condition: service_healthy

volumes:
  postgres_data:
  metabase_data:
